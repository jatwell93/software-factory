name: Change ids

# Written by software-factory (init). Calls the factory's reusable workflow at a
# pinned ref; change the pin with `upgrade`, not by hand. Require the check
# `change-ids / Change ids` in the default branch's ruleset (a reusable
# workflow's check is named <caller job> / <called job>).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: change-ids-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-ids:
    uses: jatwell93/software-factory/.github/workflows/check-change-ids.yml@__FACTORY_REF__
    with:
      factory_ref: __FACTORY_REF__
