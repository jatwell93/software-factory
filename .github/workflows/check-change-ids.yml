name: Change ids (reusable)

# Fails a PR that adds a change folder whose id the factory cannot run: not
# lowercase letters, digits and hyphens, or longer than the project's limit.
# Without this check a bad id is first caught when a run starts, after the plan
# PR merged.
#
# The caller (templates/workflows/check-change-ids.yml) triggers on
# pull_request_target, so the default branch's config and the pinned factory code
# judge the PR, never its own copy. The PR's code is never checked out: the check
# reads only the file list from the API. pull_request_target does not always fire on a
# push, so the caller can also be dispatched with `pr`: the `factory/reviews-settled`
# run does that for a factory PR whose head has no status after a grace period.
#
# The result is posted as the commit status `factory/change-ids` on the PR head,
# because a pull_request_target job's own check run is attached to the base
# commit, and a required check is looked up on the head. Require
# `factory/change-ids` in the default branch's ruleset. Every PR gets a status:
# one that touches no change folder passes.

on:
  workflow_call:
    inputs:
      factory_ref:
        description: 'The commit SHA or v* tag of software-factory this workflow was called at'
        required: true
        type: string
      pr:
        description: 'PR number, when the caller was dispatched instead of triggered by a PR'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  change-ids:
    name: Change ids
    # A dispatch from another branch would run that branch's copy of the caller.
    if: github.event_name == 'pull_request_target' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the default branch (never the PR head)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout the factory at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: jatwell93/software-factory
          ref: ${{ inputs.factory_ref }}
          path: .software-factory
          persist-credentials: false

      - name: Install the factory's dependencies
        run: npm ci --omit=dev --prefix .software-factory

      # A dispatch carries only the PR number: read the head from the API.
      - name: Read the PR's head for a dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr must be a PR number, got '$PR_NUMBER'" >&2
            exit 1
          fi
          echo "HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)" >> "$GITHUB_ENV"

      - name: Check the ids of the change folders the PR touches
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/pr-files.txt"
          # A dispatch read the head first: if a push landed since, the files are the
          # new head's, and that push's own run judges it.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] &&
            [ "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)" != "$HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER moved past $HEAD_SHA; not posting a status for it"
            exit 0
          fi
          if node .software-factory/scripts/check-change-ids.js --files "$RUNNER_TEMP/pr-files.txt"; then
            gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=success \
              -f context=factory/change-ids -f description="Every change id is valid"
          else
            gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=failure \
              -f context=factory/change-ids -f description="A change folder has an id the factory cannot run"
            exit 1
          fi
