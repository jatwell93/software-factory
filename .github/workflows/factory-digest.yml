name: Factory digest (reusable)

# One comment a day on the digest issue: needs-human items, open factory PRs with
# their pr-feedback verdict, and factory runs that failed in the last day.
# scripts/factory-digest.js posts nothing when all three are empty.
#
# The caller (templates/workflows/factory-digest.yml) holds the schedule.
# Runs the default branch's config and the pinned factory code with the job
# token only: no Claude run, no checkout of PR code, no secret.

on:
  workflow_call:
    inputs:
      factory_ref:
        description: 'The commit SHA or v* tag of software-factory this workflow was called at'
        required: true
        type: string

permissions:
  contents: read
  issues: write # the digest issue, its label and the comment
  pull-requests: read
  actions: read # gh run list for failed factory runs
  checks: read # gh pr checks (pr-feedback.js)
  statuses: read # commit statuses such as factory/no-go-guard

jobs:
  digest:
    name: Post the digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout the factory at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: jatwell93/software-factory
          ref: ${{ inputs.factory_ref }}
          path: .software-factory
          persist-credentials: false

      - name: Install the factory's dependencies
        run: npm ci --omit=dev --prefix .software-factory

      - name: Read the runner settings from factory.config.yml
        id: env
        run: node .software-factory/scripts/factory-env.js >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.env.outputs.node_version }}

      - name: Post the digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node .software-factory/scripts/factory-digest.js
