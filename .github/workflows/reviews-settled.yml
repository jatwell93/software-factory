name: Reviews settled (reusable)

# Publishes the commit status `factory/reviews-settled` on factory PRs: pending
# until the quiet window has ended, the checks have finished and every configured
# review bot has posted; success after. It also turns to success once
# `reviews_timeout_minutes` have passed since the last push, naming the bots that
# never posted, so a bot that is down cannot hold it forever. This keeps the owner
# from merging before a late review (Copilot, say) has landed.
#
# The caller (templates/workflows/reviews-settled.yml) holds the triggers: the PR
# and review events, which carry the PR number, and an every-15-minutes schedule
# that handles every open factory PR and ends a quiet window no event announces.
# Require `factory/reviews-settled` in the default branch's ruleset to make it a
# gate; left out of the ruleset it is information on the PR.
#
# No PR code is checked out: the config is the default branch's and the code is
# the factory at the pinned `factory_ref`. The PR is read through the API.

on:
  workflow_call:
    inputs:
      factory_ref:
        description: 'The commit SHA or v* tag of software-factory this workflow was called at'
        required: true
        type: string
      pr:
        description: 'PR number, when the caller was dispatched instead of triggered by a PR'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

jobs:
  settle:
    name: Publish factory/reviews-settled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout the factory at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: jatwell93/software-factory
          ref: ${{ inputs.factory_ref }}
          path: .software-factory
          persist-credentials: false

      - name: Install the factory's dependencies
        run: npm ci --omit=dev --prefix .software-factory

      - name: Read the runner settings from factory.config.yml
        id: env
        run: node .software-factory/scripts/factory-env.js >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.env.outputs.node_version }}

      - name: Publish the status
        run: node .software-factory/scripts/factory-reviews-settled.js ${PR_NUMBER:+"$PR_NUMBER"}
